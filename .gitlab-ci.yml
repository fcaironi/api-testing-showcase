image: node:22

stages:
  - test

api-tests:
  stage: test
  variables:
    CI: 'true'
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run typecheck
    # Deterministic run against the local mock. Use `npm test` for the live public API.
    - npm run test:mock
  # Runs even when tests fail, so the report is always there.
  after_script:
    - npm run report
  artifacts:
    when: always
    expire_in: 2 weeks
    paths:
      - allure-report/
      - test-results/
    reports:
      junit: test-results/junit.xml
